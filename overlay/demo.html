<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Overlay Demo (Simulasi)</title>
<style>
  body { margin: 0; background: #111; display: grid; place-items: center; min-height: 100vh; font-family: system-ui; }
  .phone {
    width: 405px; height: 720px;
    background: linear-gradient(160deg, #2a1a3a, #1a2a3a);
    border-radius: 24px; position: relative; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .controls { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
  button { padding: 10px 16px; border-radius: 8px; border: 0; background: #fe2c55; color: #fff; font-weight: 700; cursor: pointer; }
  button.alt { background: #25f4ee; color: #000; }
</style>
</head>
<body>
<div class="phone"><iframe id="f" src="overlay.html?username=demo&apiKey=demo&goal=5000&goalTitle=Target%20Hari%20Ini"></iframe></div>
<div class="controls">
  <button onclick="send('gift', {user:{uniqueId:'sultan_'+rnd()}, giftName:'Rose', diamondCount:1, repeatCount:1})">Gift kecil</button>
  <button onclick="send('gift', {user:{uniqueId:'sultan_'+rnd()}, giftName:'Galaxy', diamondCount:1000, repeatCount:1})">Gift SULTAN</button>
  <button class="alt" onclick="send('like', {likeCount:15, totalLikes: (window.tl=(window.tl||0)+15)})">Like x15</button>
  <button class="alt" onclick="send('member', {user:{uniqueId:'viewer_'+rnd()}})">Join</button>
  <button class="alt" onclick="send('chat', {user:{uniqueId:'viewer_'+rnd()}, comment:'!hujan'})">!hujan</button>
  <button class="alt" onclick="send('chat', {user:{uniqueId:'viewer_'+rnd()}, comment:'!sapa halo semuanya, salam dari Jakarta!'})">!sapa</button>
  <button class="alt" onclick="send('chat', {user:{uniqueId:'viewer_'+rnd()}, comment:'keren banget 🔥🔥😍'})">Chat emoji</button>
  <button class="alt" onclick="send('chat', {user:{uniqueId:'viewer_'+rnd()}, comment:'wkwkwk ngakak'})">wkwk</button>
  <button class="alt" onclick="for(let i=0;i<25;i++)setTimeout(()=>send('chat',{user:{uniqueId:'viewer_'+rnd()},comment:['gas','mantap 🔥','wkwk','halo','❤️❤️'][i%5]}),i*120)">Spam chat (hype!)</button>
  <button onclick="send('chat', {user:{uniqueId:'viewer_'+rnd()}, comment:'cek kodam'})">Cek kodam</button>
  <button onclick="send('chat', {user:{uniqueId:'viewer_'+rnd()}, comment:'cek nasib'})">Cek nasib</button>
  <button class="alt" onclick="send('battle', {battleId:'pk1', status:2, battleDuration:300, teams:[{hostUserId:'h1'},{hostUserId:'h2'}], scores:[0,0]})">PK Start</button>
  <button class="alt" onclick="send('chat', {user:{uniqueId:'viewer_'+rnd()}, comment:'!pilih 1'})">!pilih 1</button>
  <button class="alt" onclick="send('chat', {user:{uniqueId:'viewer_'+rnd()}, comment:'!pilih 2'})">!pilih 2</button>
  <button class="alt" onclick="send('battleArmies', {battleId:'pk1', status:1, teams:[], hosts:[{hostUserId:'h1', teamTotalScore:3200, teamIdx:0, contributors:[{userId:'h1', score:3200, nickname:'Katarina'}]},{hostUserId:'h2', teamTotalScore:1800, teamIdx:1, contributors:[{userId:'h2', score:1800, nickname:'Rizky'}]}]})">PK Skor</button>
  <button class="alt" onclick="send('battle', {battleId:'pk1', status:3, teams:[], scores:[3200,1800]})">PK End</button>
</div>
<script>
  // Simulasi: inject event langsung ke overlay tanpa WebSocket asli.
  const f = document.getElementById('f');
  const rnd = () => Math.floor(Math.random() * 99);
  function send(event, data) {
    const w = f.contentWindow;
    // panggil handler internal via monkey-patched WebSocket message
    w.dispatchEvent(new w.CustomEvent('demo-event', { detail: { event, data } }));
  }
  // patch WebSocket di iframe agar tidak connect beneran + listen demo events
  f.addEventListener('load', () => {
    const w = f.contentWindow;
    w.addEventListener('demo-event', (e) => {
      if (w.__onmsg) w.__onmsg({ data: JSON.stringify(e.detail) });
    });
  });
</script>
</body>
</html>
