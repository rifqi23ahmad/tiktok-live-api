<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stream Studio — Alert Pop</title>
<script src="./demo.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Stream Studio · template: alert · genre: minimal · theme: transparent overlay */
:root {
  --font-display: "Space Grotesk", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", monospace;
  --ink: oklch(98% 0.01 90);
  --ink-dim: oklch(80% 0.02 90);
  --panel: oklch(15% 0.02 280 / 0.78);
  --panel-edge: oklch(60% 0.05 280 / 0.35);
  --accent: oklch(82% 0.15 195);
  --accent-2: oklch(75% 0.19 350);
  --gold: oklch(85% 0.16 90);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: var(--font-display); color: var(--ink); }

#stage { position: fixed; inset: 0; }

/* ---------- gift alert ---------- */
#alert {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.6);
  opacity: 0;
  pointer-events: none;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.2vw;
}
#alert.show { animation: alertIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, alertOut 0.5s ease-in forwards 2.8s; }
@keyframes alertIn { to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
@keyframes alertOut { to { opacity: 0; transform: translate(-50%, -50%) scale(1.06); } }
#alert-emoji { font-size: 16vw; line-height: 1; display: block; filter: drop-shadow(0 8px 24px oklch(0% 0 0 / 0.4)); animation: floaty 2s ease-in-out infinite; }
@keyframes floaty { 50% { transform: translateY(-2vw); } }
#alert-name {
  font-size: 6vw; font-weight: 700; color: var(--accent);
  text-shadow: 0 2px 20px oklch(0% 0 0 / 0.6);
}
#alert-gift { font-size: 3.6vw; color: var(--ink); font-family: var(--font-mono); }
#alert-gift b { color: var(--gold); }
#alert.t3 #alert-emoji, #alert.t4 #alert-emoji { font-size: 22vw; animation: floaty 1.2s ease-in-out infinite, spin 3s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- floating emoji ---------- */
.float-up {
  position: fixed;
  bottom: -10vh;
  pointer-events: none;
  animation: floatUp var(--dur, 3s) linear forwards;
  z-index: 50;
}
@keyframes floatUp {
  0% { transform: translateY(0) rotate(0) scale(0.7); opacity: 0; }
  10% { opacity: 1; }
  100% { transform: translateY(-110vh) rotate(var(--rot, 0deg)) scale(var(--sc, 1)); opacity: 0; }
}

/* ---------- status ---------- */
#status { position: absolute; top: 3%; right: 3%; display: flex; align-items: center; gap: 0.8vw; font-family: var(--font-mono); font-size: 1.8vw; color: var(--ink-dim); opacity: 0.85; }
#status .dot { width: 1.4vw; height: 1.4vw; border-radius: 50%; background: oklch(70% 0.19 25); }
#status.on .dot { background: oklch(70% 0.17 155); box-shadow: 0 0 0 3px oklch(70% 0.17 155 / 0.3); }
</style>
</head>
<body>
<div id="stage">
  <div id="status"><span class="dot"></span><span id="status-text">connecting…</span></div>

  <div id="alert">
    <span id="alert-emoji">🎁</span>
    <span id="alert-name">@name</span>
    <span id="alert-gift">mengirim <b>Gift</b></span>
  </div>
</div>

<script>
(() => {
  const qs = new URLSearchParams(location.search)
  const USERNAME = qs.get('username')
  const API_KEY = qs.get('apiKey')
  const DEMO = qs.get('demo') === '1'

  const alertEl = document.getElementById('alert')
  const aEmoji = document.getElementById('alert-emoji')
  const aName = document.getElementById('alert-name')
  const aGift = document.getElementById('alert-gift')

  function tierOf(d) { return d >= 1000 ? 4 : d >= 100 ? 3 : d >= 10 ? 2 : 1 }
  const tierEmoji = { 1: '🎁', 2: '💝', 3: '🚀', 4: '👑' }

  function showAlert(user, giftName, diamonds) {
    const t = tierOf(diamonds)
    alertEl.className = 't' + t
    aEmoji.textContent = tierEmoji[t]
    aName.textContent = '@' + user
    aGift.innerHTML = 'mengirim <b></b>'
    aGift.querySelector('b').textContent = `${giftName} · ${diamonds.toLocaleString('id-ID')} 💎`
    alertEl.classList.remove('show')
    void alertEl.offsetWidth
    alertEl.classList.add('show')
  }

  const EMOJI_RE = /\p{Extended_Pictographic}/gu
  function floatEmoji(char) {
    const p = document.createElement('div')
    p.className = 'float-up'
    p.textContent = char
    p.style.left = (5 + Math.random() * 85) + 'vw'
    p.style.setProperty('--dur', (2.6 + Math.random() * 2) + 's')
    p.style.setProperty('--rot', (Math.random() * 60 - 30) + 'deg')
    p.style.setProperty('--sc', (0.8 + Math.random() * 0.9).toFixed(2))
    p.style.setProperty('--fs', (5 + Math.random() * 5).toFixed(1) + 'vw')
    document.body.appendChild(p)
    setTimeout(() => p.remove(), 5200)
  }

  const statusEl = document.getElementById('status')
  const statusText = document.getElementById('status-text')

  function handleMessage(evt) {
    let msg
    try { msg = JSON.parse(evt.data) } catch { return }
    const d = msg.data || {}
    const user = d.user?.uniqueId || ''
    switch (msg.event) {
      case 'gift': {
        if (d.giftType === 1 && !d.repeatEnd) break
        const diamonds = (d.diamondCount || 0) * (d.repeatCount || 1)
        if (diamonds <= 0) break
        showAlert(user, d.giftName || 'Gift', diamonds)
        break
      }
      case 'chat': {
        const emojis = (d.comment || '').match(EMOJI_RE)
        if (emojis) emojis.slice(0, 3).forEach((e, i) => setTimeout(() => floatEmoji(e), i * 150))
        break
      }
    }
  }

  let ws, retry = 0
  function connect() {
    statusText.textContent = 'connecting…'
    ws = new WebSocket(`wss://api.tik.tools?uniqueId=${encodeURIComponent(USERNAME || '')}&apiKey=${encodeURIComponent(API_KEY || '')}`)
    ws.onopen = () => { retry = 0; statusEl.classList.add('on'); statusText.textContent = DEMO ? 'DEMO' : '@' + USERNAME }
    ws.onmessage = handleMessage
    ws.onclose = () => { statusEl.classList.remove('on'); statusText.textContent = 'reconnecting…'; setTimeout(connect, Math.min(30000, 1000 * 2 ** retry++)) }
  }
  connect()
})()
</script>
</body>
</html>
